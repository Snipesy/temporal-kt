# Enable the build cache to save time by reusing outputs produced by other successful builds.
# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# Enable the configuration cache to reuse the build configuration and enable parallel task execution.
# (Note that some plugins may not yet be compatible with the configuration cache.)
# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true

# JVM memory settings
org.gradle.jvmargs=-Xmx8g -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx4g

# Project coordinates
group=com.surrealdev.temporal

# `version` is the temporal-kt SDK version: core, testing, the plugins, compiler-plugin,
# gradle-plugin.
version=0.1.11-SNAPSHOT

# The Temporal SDK-Core (Rust) release this build is wired to.
#
# core-bridge and protos are versioned as `<sdkCoreVersion>-<version>` -- for example
# 0.6.0-0.1.11 -- because their content is determined by an SDK-Core revision as much as by
# temporal-kt: protos ARE that release's schema, and core-bridge is the binding to its API.
# Encoding it in the coordinate means you can tell which Core a given artifact speaks to
# without opening it, and a Core bump is visible as a version change to consumers.
#
# core-common is NOT composite-versioned: it is hand-written Kotlin config vocabulary with no
# generated content and no direct SDK-Core coupling, so it tracks `version`.
#
# Keep this in step with the sdk-core submodule (core-bridge/rust/sdk-core); it is the version
# of the `temporalio-sdk-core` crate that the submodule points at.
sdkCoreVersion=0.6.0

# Compatibility number for the Kotlin seam between `core` and `core-bridge`.
#
# These are separately published artifacts on independent versions, so a consumer can pin a
# `core` and a `core-bridge` that do not fit together. Bump this ONLY on a breaking change to the
# com.surrealdev.temporal.core.* surface that `core` consumes; `core` records the value it was
# compiled against and refuses to start against a bridge reporting a different one, which turns a
# NoSuchMethodError deep in startup into one clear message.
bridgeAbi=1

# Temporal CLI version for dev server downloads (use "default", "latest", or "vX.Y.Z" for specific version)
temporalCliVersion=v1.6.1

org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

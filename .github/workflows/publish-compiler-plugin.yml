name: Publish compiler-plugin per Kotlin version

# Publishes per-Kotlin-version compiler-plugin artifacts to Maven Central. Iterates entries in
# `.github/kotlin-versions.json` where `publish == true`, skipping the default Kotlin version
# (already published by the mainline `publish.yml` fan-out).
#
# Trigger semantics — mirrors `publish.yml`, with an extra release-against-latest-tag phase
# baked into the push trigger so new IDEA bundles ship at the released library version
# automatically (not just as snapshots from main HEAD):
#
#   - Push to main: BOTH a snapshot publish from HEAD's source/JSON, AND a release publish
#     against the latest release tag with main's JSON grafted on top. Snapshot ships
#     `<KV>-<libVersion>-SNAPSHOT` immediately; release ships `<KV>-<latestTag>` if missing
#     (idempotent — already-shipped variants skip).
#   - Release tag: release publish from the tag's source. (No snapshot phase — tag IS released.)
#   - workflow_dispatch: manual override; `tag` input pins to a specific release tag,
#     `versions` input narrows to specific Kotlin versions.
#
# Snapshot vs release phase differs in idempotency: the snapshot phase always re-uploads
# (snapshots replace freely; search.maven.org doesn't index them anyway), the release phase
# pre-checks search.maven.org and skips already-published coords.
#
# WHY A SEPARATE WORKFLOW: mainline (core, runtime, gradle-plugin) and per-Kotlin-version
# compiler-plugin variants have different failure surfaces. A loop blip on one variant
# shouldn't taint the mainline release perception.

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Comma-separated Kotlin versions to publish (default: all publish:true entries from kotlin-versions.json, except the default version)'
        required: false
        type: string
      tag:
        description: 'Release tag to publish against (default: HEAD as snapshot)'
        required: false
        type: string

  # Snapshot publish on every push to main, mirroring `publish.yml`'s pattern. paths-ignore
  # filters out noise that doesn't affect the artifact (docs, scripts, etc.); JSON changes
  # still trigger so new variants ship immediately as snapshots when discover-bot merges.
  # `compiler` branch is included temporarily for end-to-end snapshot-publish testing before
  # this workflow lands on main; remove `compiler` once verified.
  push:
    branches: [main, compiler]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'

  # Release tags fire BOTH this workflow and publish.yml in parallel. No race because this
  # loop excludes the default Kotlin (mainline handles default).
  release:
    types: [published]

# Don't run multiple per-version publish loops simultaneously — Maven Central staging contention.
# Don't cancel in-progress: snapshots take a few minutes; cancelling mid-publish leaves Central
# in inconsistent state. Queue subsequent pushes instead.
concurrency:
  group: publish-compiler-plugin
  cancel-in-progress: false

jobs:
  publish:
    name: Publish compiler-plugin per Kotlin version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
    steps:
      # Resolve which git ref the SNAPSHOT phase should use:
      #   - release event:        the released tag itself (no snapshot phase will run anyway).
      #   - push to main:         current HEAD (snapshots from main's source).
      #   - workflow_dispatch:    explicit `tag` input → that tag; else current HEAD.
      - name: Resolve initial ref
        id: ref
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            release)             REF="${{ github.event.release.tag_name }}" ;;
            workflow_dispatch)   REF="${{ inputs.tag }}"; [ -z "$REF" ] && REF="${{ github.sha }}" ;;
            push|*)              REF="${{ github.sha }}" ;;
          esac
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Initial publish ref: $REF"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0   # need history + tags for the release-against-latest phase below

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install jq (if missing)
        shell: bash
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            (sudo apt-get update -qq && sudo apt-get install -y -qq jq) \
              || (apt-get update -qq && apt-get install -y -qq jq)
          fi

      - name: Resolve target Kotlin versions
        id: targets
        shell: bash
        run: |
          DEFAULT=$(jq -r '.default' .github/kotlin-versions.json)
          if [ -n "${{ inputs.versions }}" ]; then
            echo "::notice::Using explicit versions input: ${{ inputs.versions }}"
            TARGETS=$(echo "${{ inputs.versions }}" | tr ',' '\n' | grep -v '^$')
          else
            TARGETS=$(jq -r --arg d "$DEFAULT" \
              '.versions[] | select(.publish == true and .kotlin != $d) | .kotlin' \
              .github/kotlin-versions.json)
          fi
          if [ -z "$TARGETS" ]; then
            echo "::notice::No versions to publish; exiting cleanly."
            echo "any=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "any=true" >> "$GITHUB_OUTPUT"
          {
            echo "list<<EOF"
            echo "$TARGETS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Will publish:"
          echo "$TARGETS"

      # =========================================================================================
      # SNAPSHOT PHASE — push event, or workflow_dispatch without an explicit tag.
      # Uses HEAD's source + gradle.properties version (typically `<lib>-SNAPSHOT`).
      # No idempotency check — snapshots replace freely.
      # =========================================================================================
      - name: Snapshot publish
        if: |
          steps.targets.outputs.any == 'true' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.tag == ''))
        env:
          MODE: snapshot
          TARGETS: ${{ steps.targets.outputs.list }}
        shell: bash
        run: ./.github/scripts/publish-compiler-plugin-loop.sh

      # =========================================================================================
      # RELEASE PHASE — three sub-steps:
      # 1. Discover the release tag (release event = the tag itself; push = latest release;
      #    workflow_dispatch with tag = inputs.tag).
      # 2. Switch the working tree to that tag's source while preserving main's JSON.
      # 3. Run the publish loop with idempotency.
      # Skipped entirely if there's no usable release tag (e.g. fresh repo with zero releases).
      # =========================================================================================
      - name: Resolve release tag
        id: release_tag
        if: steps.targets.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG=""
          case "${{ github.event_name }}" in
            release)
              TAG="${{ github.event.release.tag_name }}"
              ;;
            workflow_dispatch)
              TAG="${{ inputs.tag }}"
              ;;
            push)
              TAG=$(gh release view --json tagName -q .tagName --repo "${{ github.repository }}" 2>/dev/null || echo "")
              ;;
          esac
          if [ -n "$TAG" ]; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Release-phase tag: $TAG"
          else
            echo "::notice::No release tag for the release-publish phase; skipping."
          fi

      - name: Switch working tree to release tag (graft main's JSON)
        if: |
          steps.targets.outputs.any == 'true' &&
          steps.release_tag.outputs.tag != '' &&
          github.event_name == 'push'
        shell: bash
        run: |
          # Save main's JSON before switching trees; we want the tag's source but main's
          # version-list (the whole point of the push-trigger release phase: extend variants
          # for already-released library version when new Kotlin versions land in JSON).
          cp .github/kotlin-versions.json /tmp/main-versions.json
          git fetch origin "${{ steps.release_tag.outputs.tag }}" --depth=1
          git checkout "${{ steps.release_tag.outputs.tag }}" -- .
          cp /tmp/main-versions.json .github/kotlin-versions.json
          echo "Working tree now at tag ${{ steps.release_tag.outputs.tag }} with main's JSON applied"

      - name: Release publish
        if: |
          steps.targets.outputs.any == 'true' &&
          steps.release_tag.outputs.tag != ''
        env:
          MODE: release
          TARGETS: ${{ steps.targets.outputs.list }}
        shell: bash
        run: ./.github/scripts/publish-compiler-plugin-loop.sh

name: Multi-Kotlin compatibility

# Validates that the compiler-plugin source COMPILES against multiple Kotlin compiler ABIs.
# Versions live in `.github/kotlin-versions.json` (single source of truth, also read by
# `publish-compiler-plugin.yml` and `discover-kotlin-versions.yml`). One leg per entry,
# each running `:compiler-plugin:compileKotlin` against that Kotlin version.
#
# This workflow does NOT run tests. The full test suite executes once via `publish.yml`'s
# `gradle build` step at the pinned default Kotlin — that's sufficient validation. Running
# tests across N Kotlin versions in this workflow would require per-version `.fir.txt` /
# `.fir.ir.txt` goldens (kotlinx-rpc-style) which is bespoke test infrastructure not yet wired.

on:
  push:
    branches: [main, compiler]
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  matrix-config:
    name: Build matrix from kotlin-versions.json
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted ubuntu-latest preinstalls jq; non-GitHub runners (act with the
      # gradle:9.4.1-jdk25 image, etc.) don't. Install idempotently — the `command -v` guard
      # short-circuits on hosted runners.
      - name: Install jq (if missing)
        shell: bash
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            (sudo apt-get update -qq && sudo apt-get install -y -qq jq) \
              || (apt-get update -qq && apt-get install -y -qq jq)
          fi

      - id: config
        run: |
          MATRIX=$(jq -c '{include: [.versions[] | { name: .kotlin, kotlin: .kotlin }]}' \
            .github/kotlin-versions.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix: $MATRIX"

  matrix:
    name: Kotlin ${{ matrix.name }}
    needs: matrix-config
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-config.outputs.matrix) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # `-PskipNativeBuild=true` decouples compileKotlin from the Rust core-bridge natives.
      # The compiler-plugin module doesn't need natives at compile time; skipping cuts setup.
      - name: Compile against Kotlin ${{ matrix.kotlin }}
        run: ./gradlew :compiler-plugin:compileKotlin -Pkotlin.lang=${{ matrix.kotlin }} -Pkotlin.compiler=${{ matrix.kotlin }} -PskipNativeBuild=true

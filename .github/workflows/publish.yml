name: Publish to Maven Central

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use gradle.properties version)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # Was three stages: a 4-way native matrix, a test matrix, then publish. The native library now
  # comes from SurrealDevelopment/temporal-kt-bridge as a published artifact, so this is one job
  # with no Rust, no protoc and no submodules.
  publish:
    name: Publish to Maven Central
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write  # release asset uploads
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Anchored so it cannot match bridgeVersion=, bridgeSdkCoreVersion= or any future
      # *version= property.
      - name: Set version from release tag
        if: github.event_name == 'release'
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "Publishing version: $VERSION"
          sed -i "s/^version=.*/version=$VERSION/" gradle.properties

      - name: Set version from input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: sed -i "s/^version=.*/version=${{ inputs.version }}/" gradle.properties

      # A release must not depend on an unreleased bridge, or consumers resolve a SNAPSHOT that
      # can change underneath them (or disappear).
      - name: Reject SNAPSHOT bridge on a release
        if: github.event_name == 'release'
        run: |
          BRIDGE=$(grep '^bridgeVersion=' gradle.properties | cut -d= -f2)
          if [[ "$BRIDGE" == *SNAPSHOT* ]]; then
            echo "ERROR: releasing against bridgeVersion=$BRIDGE. Release temporal-kt-bridge first."
            exit 1
          fi
          echo "OK: bridgeVersion=$BRIDGE"

      - name: Build and test
        run: ./gradlew build :core:checkKotlinAbi

      - name: Verify JAR contents
        run: |
          set -euo pipefail
          # Natives live in the bridge's classifier jars; nothing here should carry one.
          # Proto classes come from the separate protos artifact -- if they reappear in core.jar,
          # someone has re-added the proto source dirs and consumers get duplicate classes.
          fail=0
          for jar in */build/libs/*.jar plugins/*/build/libs/*.jar; do
            [ -f "$jar" ] || continue
            case "$jar" in *-sources.jar|*-javadoc.jar) continue;; esac
            if unzip -l "$jar" | grep -qE ' native/'; then
              echo "ERROR: $jar contains native libraries"; fail=1
            fi
            if unzip -l "$jar" | grep -qE ' (io/temporal/api|coresdk)/'; then
              echo "ERROR: $jar contains generated proto classes"; fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "OK: no jar carries natives or protos"
          exit $fail

      # ORG_GRADLE_PROJECT_* env vars rather than -P flags: an ASCII-armored PGP key is
      # multi-line, and a multi-line value interpolated into a shell command line does not reach
      # Gradle intact -- signing then fails with "Could not evaluate spec for 'Signing is
      # required, or signatory is set'". Env vars carry newlines, and this is the documented form.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_TOKEN }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache --no-daemon

      - name: Upload artifacts to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            core/build/libs/*.jar
            core-testing/build/libs/*.jar
            compiler-plugin/build/libs/*.jar
            gradle-plugin/build/libs/*.jar
            plugins/di/build/libs/*.jar
            plugins/opentelemetry/build/libs/*.jar
            plugins/health/build/libs/*.jar
